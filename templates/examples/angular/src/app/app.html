<main class="container">
  <h1>Personas</h1>
  <p class="subtitle">Datos consumidos desde {{ apiUrl }}</p>

  @if (loading()) {
    <p class="status">Cargando...</p>
  }
  @if (error(); as message) {
    <p class="status error">No se pudo cargar: {{ message }}</p>
  }

  <ul class="grid">
    @for (p of personas(); track p.id) {
      <li class="card">
        <div class="avatar">{{ p.nombre[0] }}{{ p.apellido[0] }}</div>
        <div class="info">
          <h2>{{ p.nombre }} {{ p.apellido }}</h2>
          <span class="badge">{{ p.edad }} anos</span>
        </div>
      </li>
    }
  </ul>
</main>
